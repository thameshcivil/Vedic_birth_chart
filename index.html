<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aarush Panchangam</title>
<meta name="description" content="Daily panchangam, festival calendar, birth chart, sankalpam and Vedic alarms.">
<meta name="theme-color" content="#f6efe3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <button class="appbar__back iconbtn" data-action="nav-back" hidden aria-label="Back"></button>
    <span class="appbar__logo" aria-hidden="true"><svg viewBox="0 0 108 108"><rect x="18" y="18" width="72" height="72" rx="18" fill="var(--accent)"/><g fill="var(--accent-ink)"><path d="M54,44a16,16 0,0 1,16 16H38a16,16 0,0 1,16 -16z"/><path d="M31,63h46v3.2H31z"/><path d="M52.4,30h3.2v9h-3.2zM34.6,38.8l2.3,-2.3 6.4,6.4 -2.3,2.3zM64.7,42.9l6.4,-6.4 2.3,2.3 -6.4,6.4z"/><path d="M41,71h26v2.4H41zM48,77.5h12v2.4H48z"/></g></svg></span>
    <h1 class="appbar__title">Aarush Panchangam</h1>
    <button class="iconbtn appbar__cal" data-action="open-calendar" aria-label="Calendar"></button>
    <button class="iconbtn" data-action="open-menu" aria-label="More options" aria-haspopup="menu"></button>
  </header>
  <nav class="toptabs" aria-label="Main"></nav>
  <div id="menu" class="menu" hidden></div>

  <main class="main">
    <section data-view="today"></section>
    <section data-view="calendar" hidden></section>
    <section data-view="sankalpam" hidden></section>
    <section data-view="reminders" hidden></section>
    <section data-view="alarms" hidden></section>
    <section data-view="stopwatch" hidden></section>
    <section data-view="jathagam" hidden></section>
    <section data-view="rasi" hidden></section>
    <section data-view="settings" hidden></section>
  </main>

  <div class="fabs" data-fabs hidden>
    <button class="fab" data-action="prev-day" aria-label="Previous day"></button>
    <button class="fab" data-action="next-day" aria-label="Next day"></button>
  </div>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input type="date" id="datepicker" class="sr-only" tabindex="-1" aria-hidden="true">
  <input type="month" id="monthpicker" class="sr-only" tabindex="-1" aria-hidden="true">

  <noscript><p class="notice">Aarush Panchangam needs JavaScript.</p></noscript>
  <script src="js/vendor/astronomy.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
