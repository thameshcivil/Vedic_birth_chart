<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aarush Panchangam</title>
<meta name="description" content="Daily panchangam, festival calendar, birth chart, sankalpam and Vedic alarms.">
<meta name="theme-color" content="#f6efe3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <span class="appbar__brand">Aarush Panchangam</span>
    <button class="appbar__loc" data-action="set-location"></button>
    <button class="iconbtn" data-action="open-settings" aria-label="Settings">
      <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.2"/></svg>
    </button>
  </header>

  <main class="main">
    <section data-view="today"></section>
    <section data-view="calendar" hidden></section>
    <section data-view="jathagam" hidden></section>
    <section data-view="sankalpam" hidden></section>
    <section data-view="alarms" hidden></section>
    <section data-view="settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main"></nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input type="date" id="datepicker" class="sr-only" tabindex="-1" aria-hidden="true">

  <noscript><p class="notice">Aarush Panchangam needs JavaScript.</p></noscript>
  <script src="js/vendor/astronomy.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
