# Publishes the web version of Aarush Panchangam to Firebase Hosting
# (project aarush-panchangam → https://aarush-panchangam.web.app) on every push.
#
# Keyless: GitHub signs in to Google Cloud through Workload Identity Federation.
# Only this repository (thameshcivil/Vedic_birth_chart) is allowed by the
# provider's condition, and it acts as the service account
# github-deployer@aarush-panchangam.iam.gserviceaccount.com, which has only
# Firebase Hosting Admin, Service Usage Consumer and Firebase Viewer.
name: Firebase Hosting

on:
  push:
    branches: [aarush-panchangam, main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the web app into public/
        run: |
          mkdir -p public
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.hallmark' --exclude 'android' \
            --exclude 'tools' --exclude 'node_modules' --exclude '*.md' --exclude '.gitignore' \
            --exclude 'public' --exclude 'firebase.json' --exclude '.firebaserc' \
            ./ public/
          find public -type f | wc -l

      - name: Sign in to Google Cloud (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/364669892420/locations/global/workloadIdentityPools/github/providers/repo
          service_account: github-deployer@aarush-panchangam.iam.gserviceaccount.com
          create_credentials_file: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting (live)
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --only hosting --project aarush-panchangam --non-interactive --message "${GITHUB_SHA::7}" 2>&1 | tee /tmp/deploy.log

      - name: Record the result on the build-status branch
        if: always()
        env:
          RESULT: ${{ job.status }}
          AUTH: ${{ steps.auth.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin build-status:build-status 2>/dev/null || true
          git worktree add /tmp/bs build-status 2>/dev/null || { git worktree add -b build-status /tmp/bs; }
          { printf 'status: %s\ncommit: %s\ntime: %s\nauth: %s\ndeploy: %s\nurl: https://aarush-panchangam.web.app\n\n' "$RESULT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "$AUTH" "$DEPLOY"
            tail -n 40 /tmp/deploy.log 2>/dev/null | grep -v -i -E 'token|secret|key' ; } > /tmp/bs/HOSTING.txt
          cd /tmp/bs && git add HOSTING.txt && git commit -qm "Hosting $RESULT ${GITHUB_SHA::7}" && git push -q origin build-status || true
